  <!-- HEADER -->

      width="100%"
      bgcolor="#111111"
      cellpadding="10"
      cellspacing="0"
      border="0"
    >
      <tr>
        <td align="center">
          <font color="#ffcc00" size="6"><b>Phuong's Gymfit</b></font
          ><br />
          <font color="#ffffff" size="2"><i>"Good things take time"</i></font>
          <nav>

              <a href="index.html"><font color="#ffcc00">Trang chủ</font></a> |

                ><font color="#ffffff">Chi tiết sản phẩm</font></a

            </font>
          </nav>
        </td>
      </tr>

    <main>
      <h1 align="center">Form Đặt Hàng</h1>

      <form action="xac-nhan.html" method="get">

        <fieldset>
          <legend><b>Thông tin khách hàng</b></legend>

          <p>
            <label for="hoten">Họ và tên:</label><br />
            <input type="text" id="hoten" name="hoten" size="40" required />
          </p>

          <p>
            <label for="email">Email:</label><br />
            <input type="email" id="email" name="email" size="40" required />
          </p>

          <p>
            <label for="sdt">Số điện thoại:</label><br />
            <input type="tel" id="sdt" name="sdt" size="20" required />
          </p>
        </fieldset>

        <br />

        <fieldset>
          <legend><b>Chọn sản phẩm</b></legend>

          <p>
            <label for="sanpham">Sản phẩm:</label>
            <select id="sanpham" name="sanpham" required>
              <option value="">-- Chọn sản phẩm --</option>
              <optgroup label="Quần áo tập gym">
                <option value="SP01">SP01 - Set gym nữ tay ngắn (190.000 đ)</option>
                <option value="SP02">SP02 - Set đồ tập gym nữ ngắn tay (220.000 đ)</option>
                <option value="SP03">SP03 - Bộ bra yoga nữ (150.000 đ)</option>
              </optgroup>
              <optgroup label="Tạ & Dây kháng lực">
                <option value="SP04">SP04 - Bộ tạ tay cao su 5kg (500.000 đ)</option>
                <option value="SP05">SP05 - Bộ tạ tay 1kg cho nữ (80.000 đ)</option>
                <option value="SP06">SP06 - Bộ 6 dây kháng lực (520.000 đ)</option>
                <option value="SP07">SP07 - Dây kháng lực hình số 8 (120.000 đ)</option>
              </optgroup>
              <optgroup label="Thảm tập & Găng tay">
                <option value="SP08">SP08 - Thảm Yoga/Gym 6mm (300.000 đ)</option>
                <option value="SP09">SP09 - Găng Tay Tập Gym (150.000 đ)</option>
                <option value="SP10">SP10 - Bình Lắc Protein 500ml (99.000 đ)</option>
              </optgroup>
            </select>
          </p>

          <p>
            <label for="soluong">Số lượng:</label>
            <input type="number" id="soluong" name="soluong" min="1" max="99" value="1" required />
          </p>

          <p>
            <b>Hình thức nhận hàng:</b><br />
            <input type="radio" id="giao" name="nhanhang" value="giao" checked />
            <label for="giao">Giao tận nơi</label><br />
            <input type="radio" id="taicua" name="nhanhang" value="taicua" />
            <label for="taicua">Nhận tại cửa hàng</label>
          </p>

          <p>
            <b>Phụ kiện thêm:</b><br />
            <input type="checkbox" id="gang" name="phukien" value="gang" />
            <label for="gang">Găng tay tập gym (+150.000 đ)</label><br />
            <input type="checkbox" id="binh" name="phukien" value="binh" />
            <label for="binh">Bình lắc protein (+99.000 đ)</label><br />
            <input type="checkbox" id="day" name="phukien" value="day" />
            <label for="day">Dây kháng lực số 8 (+120.000 đ)</label>
          </p>

          <p>
            <label for="ghichu">Ghi chú:</label><br />
            <textarea id="ghichu" name="ghichu" rows="4" cols="50"
                      placeholder="Yêu cầu thêm (size, màu, thời gian giao...)"></textarea>
          </p>
        </fieldset>

        <br />
        <p align="center">
          <input type="submit" value="Gửi đơn hàng (Demo)" />
          <input type="reset" value="Xóa form" />
        </p>
      </form>

      <p><a href="index.html">← Về trang chủ</a></p>
    </main>

    <footer bgcolor="#111111" align="center">
      <font color="#ffffff" size="2">
        <p>Phuong's Gymfit - Demo WDLab02. Không xử lý thanh toán.</p>
      </font>
    </footer>
  </body>
</html>
